<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northwest Arkansas Urban Centers</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-title {
            background: white;
            padding: 12px 16px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        .map-title h1 {
            margin: 0;
            font-size: 20px;
        }

        .map-title p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #555;
        }

        .city-label {
            background: transparent;
            border: none;
            box-shadow: none;
            font-weight: bold;
            font-size: 14px;
            color: #222;
        }

    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        // -----------------------------------------
        // CREATE THE MAP
        // -----------------------------------------

        const map = L.map('map');


        // -----------------------------------------
        // OPENSTREETMAP BASE MAP
        // -----------------------------------------

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);


        // -----------------------------------------
        // NORTHWEST ARKANSAS VIEW
        // -----------------------------------------

        const nwaBounds = [
            [35.85, -94.65],
            [36.55, -93.45]
        ];

        map.fitBounds(nwaBounds);


        // -----------------------------------------
        // TITLE
        // -----------------------------------------

        const title = L.control({
            position: 'topright'
        });

        title.onAdd = function () {

            const div = L.DomUtil.create(
                'div',
                'map-title'
            );

            div.innerHTML = `
                <h1>Northwest Arkansas</h1>
                <p>Urban Centers Project</p>
            `;

            return div;
        };

        title.addTo(map);

    </script>

</body>
</html>
