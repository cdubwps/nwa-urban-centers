<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northwest Arkansas Urban Centers</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-title {
            background: white;
            padding: 12px 16px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        .map-title h1 {
            margin: 0;
            font-size: 20px;
        }

        .map-title p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #555;
        }

        .city-label {
            background: transparent;
            border: none;
            box-shadow: none;
            font-weight: bold;
            font-size: 14px;
            color: #222;
        }

    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        // -----------------------------------------
        // CREATE THE MAP
        // -----------------------------------------

        const map = L.map('map');


        // -----------------------------------------
        // OPENSTREETMAP BASE MAP
        // -----------------------------------------

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);


        // -----------------------------------------
        // NORTHWEST ARKANSAS VIEW
        // -----------------------------------------

        const nwaBounds = [
            [35.85, -94.65],
            [36.55, -93.45]
        ];

        map.fitBounds(nwaBounds);


        // -----------------------------------------
        // CITY LOCATIONS
        // -----------------------------------------

        const cities = [

            {
                name: "Fayetteville",
                lat: 36.06258,
                lon: -94.15743
            },

            {
                name: "Springdale",
                lat: 36.1867,
                lon: -94.1288
            },

            {
                name: "Rogers",
                lat: 36.3320,
                lon: -94.1185
            },

            {
                name: "Bentonville",
                lat: 36.3729,
                lon: -94.2088
            },

            {
                name: "Bella Vista",
                lat: 36.46780,
                lon: -94.26700
            },

            {
                name: "Centerton",
                lat: 36.36527,
                lon: -94.28869
            },

            {
                name: "Lowell",
                lat: 36.2554,
                lon: -94.1308
            },

            {
                name: "Tontitown",
                lat: 36.16190,
                lon: -94.25230
            },

            {
                name: "Johnson",
                lat: 36.13348,
                lon: -94.16295
            },

            {
                name: "Farmington",
                lat: 36.04203,
                lon: -94.24715
            },

            {
                name: "Pea Ridge",
                lat: 36.45150,
                lon: -94.11620
            },

            {
                name: "Cave Springs",
                lat: 36.27260,
                lon: -94.22230
            }

        ];


        // -----------------------------------------
        // ADD CITY LABELS
        // -----------------------------------------

        cities.forEach(city => {

            L.marker(
                [city.lat, city.lon],
                {
                    icon: L.divIcon({
                        className: 'city-label',
                        html: city.name,
                        iconSize: null
                    })
                }
            ).addTo(map);

        });


        // -----------------------------------------
        // TITLE
        // -----------------------------------------

        const title = L.control({
            position: 'topright'
        });

        title.onAdd = function () {

            const div = L.DomUtil.create(
                'div',
                'map-title'
            );

            div.innerHTML = `
                <h1>Northwest Arkansas</h1>
                <p>Urban Centers Project</p>
            `;

            return div;
        };

        title.addTo(map);

    </script>

</body>
</html>
